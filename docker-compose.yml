services:
  postgres:
    image: postgres:16-alpine
    container_name: whatsapp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-whatsapp_gateway}
    # Bound to localhost only: the gateway reaches the database over the compose network
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-whatsapp_gateway}"]
      interval: 5s
      timeout: 5s
      retries: 5

  whatsapp-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whatsapp_gateway_api
    restart: unless-stopped
    # Time for the graceful shutdown (finish the message being sent, flush webhooks)
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      NODE_ENV: production
      API_KEY: ${API_KEY:?Set API_KEY (min. 16 characters) in .env}
      QR_LINK_TTL_SECONDS: ${QR_LINK_TTL_SECONDS:-600}
      DEFAULT_COUNTRY_CODE: ${DEFAULT_COUNTRY_CODE:-62}
      ALLOW_PRIVATE_URLS: ${ALLOW_PRIVATE_URLS:-false}
      MEDIA_MAX_BYTES: ${MEDIA_MAX_BYTES:-52428800}
      WA_VERSION: ${WA_VERSION:-}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-whatsapp_gateway}
      GLOBAL_WEBHOOK_URL: ${GLOBAL_WEBHOOK_URL:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      WEBHOOK_MAX_ATTEMPTS: ${WEBHOOK_MAX_ATTEMPTS:-10}
      WEBHOOK_RETENTION_DAYS: ${WEBHOOK_RETENTION_DAYS:-7}
      SEND_INTERVAL_MIN_MS: ${SEND_INTERVAL_MIN_MS:-2000}
      SEND_INTERVAL_MAX_MS: ${SEND_INTERVAL_MAX_MS:-6000}
      SEND_WAIT_TIMEOUT_MS: ${SEND_WAIT_TIMEOUT_MS:-60000}
      QUEUE_MAX_AGE_HOURS: ${QUEUE_MAX_AGE_HOURS:-24}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MIN_TYPING_DELAY_MS: ${MIN_TYPING_DELAY_MS:-1200}
      MAX_TYPING_DELAY_MS: ${MAX_TYPING_DELAY_MS:-3000}
      AUTO_READ_MESSAGES: ${AUTO_READ_MESSAGES:-true}
      VALIDATE_DAILY_LIMIT: ${VALIDATE_DAILY_LIMIT:-200}
      # Anti-Ban Guard (README, "Anti-Ban Guard"); the remaining guard variables keep their defaults
      NEW_CONTACT_DAILY_LIMIT: ${NEW_CONTACT_DAILY_LIMIT:-20}
      NEW_CONTACT_INTERVAL_MIN_MS: ${NEW_CONTACT_INTERVAL_MIN_MS:-60000}
      NEW_CONTACT_INTERVAL_MAX_MS: ${NEW_CONTACT_INTERVAL_MAX_MS:-180000}
      NEW_SESSION_COOLDOWN_HOURS: ${NEW_SESSION_COOLDOWN_HOURS:-72}
      CAMPAIGN_HOURS: ${CAMPAIGN_HOURS:-08:00-20:00}
      CAMPAIGN_TIMEZONE: ${CAMPAIGN_TIMEZONE:-Asia/Jakarta}
      CAMPAIGN_RECIPIENT_COOLDOWN_HOURS: ${CAMPAIGN_RECIPIENT_COOLDOWN_HOURS:-72}
      CAMPAIGN_REQUIRE_CONSENT: ${CAMPAIGN_REQUIRE_CONSENT:-true}
      OPT_OUT_KEYWORDS: "${OPT_OUT_KEYWORDS:-STOP,BERHENTI,UNSUBSCRIBE,UNSUB,STOP PROMO,BERHENTI PROMO}"
      OPT_IN_KEYWORDS: "${OPT_IN_KEYWORDS:-START,SUBSCRIBE,LANGGANAN}"
    ports:
      - "${PORT:-3000}:3000"

volumes:
  pgdata:
    driver: local
